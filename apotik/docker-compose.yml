version: '3'
services:
  apotik:
    build: ./php
    image: laravel:latest
    container_name: apotik
    hostname: "apotik"
    volumes:
      - ./src:/var/www/html
      - ./php/www.conf:/usr/local/etc/php-fpm.d/www.conf
    working_dir: /var/www/html
    depends_on: 
      - db_apotik

  db_apotik:
    image: mariadb:10.2
    container_name: db_apotik
    restart: unless-stopped
    tty: true
    ports:
      - "13306:3306"
    volumes:
      - ./database/data:/var/lib/mysql
      - ./conf.d:/etc/mysql/conf.d:ro
    environment:
      MYSQL_DATABASE: your_database
      MYSQL_USER: droid
      MYSQL_PASSWORD: roid1234
      MYSQL_ROOT_PASSWORD: roid12345
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql

  nginx_apotik:
    build: ./nginx
    image: nginx:latest
    container_name: nginx_apotik
    hostname: "nginx_apotik"
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - apotik
